plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '6.25.0'
}

group = 'com.app'
version = '0.0.1-SNAPSHOT'
description = 'returns'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencies {
    // Spring Web — REST API 서버 역할의 핵심
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // Request Validation — REST 요청 검증
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Actuator — RIA 관리자가 이 서비스에 의존하니, 헬스체크 필수
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // DB
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.4'

    // MariaDB
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'

    // Swagger / OpenAPI — RIA 관리자와의 API 계약 문서화용
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'

    // CVE-2025-48924 대응 - commons-lang3를 안전한 버전으로 강제
    implementation 'org.apache.commons:commons-lang3:3.18.0'

    // 외부 API 호출용 (KIS Open API, 공공데이터포털)
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    // 공공데이터포털 API는 기본 응답이 XML인 경우가 많음 - JSON 파라미터 안 쓸 경우 대비
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml'

    // DTO Mapping
    implementation 'org.modelmapper:modelmapper:3.2.0'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Configuration Processor
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    // DevTools
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // Test
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'com.h2database:h2'
}

tasks.named('test') {
    useJUnitPlatform()
}

spotless {
    java {
        googleJavaFormat().aosp()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
        targetExclude("build/**")
    }
}
